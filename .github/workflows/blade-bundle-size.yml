name: Blade Bundle Size

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

permissions:
  contents: write      # pushes base stats to the bundle-size-stats branch

env:
  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  pr-bundle-size:
    name: Generate PR Report
    # GitHub-hosted on purpose: this runs PR code (including from forks), which must not run on
    # razorpay's self-hosted runners. It makes no GitHub API calls, so the org IP allow list
    # (403 since 12 Nov 2026) does not affect it: the report goes to the job summary, not a PR comment.
    runs-on: ubuntu-latest # nosemgrep: non-self-hosted-runner
    if: ${{ github.event_name == 'pull_request' && github.event.head_commit.author.name != 'rzpcibot' }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # PR merge commit + its first parent (base branch tip)
      - name: Use Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Setup Cache & Install Dependencies
        uses: ./.github/actions/install-dependencies
      - name: Update Bundle Size Data
        run: yarn generate-bundle-size-info
        working-directory: packages/blade
      # HEAD is the PR merge commit, so diffing against its first parent gives the PR's changed files.
      - name: Write Bundle Size Report to Job Summary
        run: node scripts/writeBundleSizeSummary.js $(git diff --name-only HEAD^1 HEAD)
        working-directory: packages/blade

  master-bundle-size:
    name: Update Base Stats
    # razorpay's k8s runner pool, not GitHub-hosted: the org IP allow list refuses pushes from
    # GitHub-hosted runners (403 since 12 Nov 2026).
    runs-on: [k8s-runner, non-api, xlarge-size, linux-amd64]
    if: ${{ github.event_name == 'push' }}
    concurrency:
      group: bundle-size-stats-update
      cancel-in-progress: false
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
      - name: Use Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Setup Cache & Install Dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build Blade React Production
        run: yarn run-s build:clean build:generate-types build:react-prod
        working-directory: packages/blade
      - name: Update Bundle Size Data
        run: yarn generate-bundle-size-info
        working-directory: packages/blade
        env:
          BUNDLE_SIZE_STATS_FILENAME: 'baseBundleSizeStats.json'
      - name: Check if file is modified
        id: file-check
        run: if [ -n "$(git status baseBundleSizeStats.json --porcelain)" ]; then echo "result=true" >> $GITHUB_OUTPUT; else echo "result=false" >> $GITHUB_OUTPUT; fi
        working-directory: packages/blade
      - name: Commit Updated Bundle Size Data
        if: ${{ steps.file-check.outputs.result == 'true' }}
        run: |
          git config user.email "tools+cibot@razorpay.com"
          git config user.name "rzpcibot"
          git add baseBundleSizeStats.json
          git commit -m "chore: update bundle size data [skip ci]"
          git push origin master:bundle-size-stats --force
        working-directory: packages/blade
