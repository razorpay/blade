name: Agentic Repo / Slash PR Healer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to heal'
        required: true
        type: string
  workflow_run:
    workflows: ['Blade Validate']
    types: [completed]

concurrency:
  group: ${{ github.repository }}-${{ github.event.inputs.pr_number || github.event.workflow_run.head_sha }}-slash-pr-healer
  cancel-in-progress: false

jobs:
  heal-pr:
    name: Heal PR via Slash
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest # nosemgrep: non-self-hosted-runner
    steps:
      # No GitHub API calls in this job: the org IP allow list refuses them from GitHub-hosted
      # runners (403 since 12 Nov 2026). PR details come from the event payload instead.
      # workflow_run.pull_requests is empty for PRs from forks, so those are skipped.
      - name: Resolve PR metadata
        id: pr-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_PR_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Public repo: an anonymous read, so no token reaches the allow list.
            PR_JSON=$(curl -fsSL "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER_INPUT")
            PR_NUMBER="$PR_NUMBER_INPUT"
            PR_BRANCH=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['ref'])")
          else
            PR_NUMBER="$RUN_PR_NUMBER"
            PR_BRANCH="$RUN_PR_BRANCH"
          fi
          PR_URL="$SERVER_URL/$REPOSITORY/pull/$PR_NUMBER"

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for this commit — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.pr-meta.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Trigger Slash PR Healer
        id: trigger-slash
        if: steps.pr-meta.outputs.skip != 'true'
        env:
          SLASH_API_USERNAME: ${{ secrets.SLASH_API_USERNAME }}
          SLASH_CI_API_KEY: ${{ secrets.SLASH_CI_API_KEY }}
          SLASH_API_PASSWORD: ${{ secrets.SLASH_API_PASSWORD }}
          SLASH_REPOSITORY_URL: https://github.com/${{ github.repository }}
          SLASH_BRANCH: ${{ steps.pr-meta.outputs.pr_branch }}
          PR_URL: ${{ steps.pr-meta.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr-meta.outputs.pr_number }}
        run: |
          PROMPT="Heal the pull request at ${PR_URL} using the /heal-pr skill from the blade repo. PR_NUMBER=${PR_NUMBER}. Strictly use the heal-pr skill from the blade repo only. Do not use any other skill."

          # Temporarily disable set -e so the script doesn't die
          # before we can print the API response when node exits 1.
          set +e
          RESPONSE_OUTPUT=$(node .github/scripts/run-slash.js "$PROMPT")
          NODE_EXIT_CODE=$?
          set -e

          # Always print the full output so Status:/Response: are
          # visible in the GitHub Actions logs — even on failure.
          echo "$RESPONSE_OUTPUT"

          if [ "$NODE_EXIT_CODE" -ne 0 ]; then
            echo "::error::Slash API call failed (exit code $NODE_EXIT_CODE). See Status: and Response: above for details."
            exit 1
          fi

          RESPONSE_JSON=$(echo "$RESPONSE_OUTPUT" | grep "^Response:" | sed 's/^Response: //')
          TASK_ID=$(echo "$RESPONSE_JSON" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('task_id',''))" 2>/dev/null || true)

          if [ -n "$TASK_ID" ]; then
            EXECUTION_URL="https://slash.concierge.razorpay.com/tasks/${TASK_ID}/execution-logs"
            echo "Execution logs: ${EXECUTION_URL}"
            echo "execution_url=$EXECUTION_URL" >> $GITHUB_OUTPUT
            echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          fi

      - name: Write execution link to job summary
        if: steps.pr-meta.outputs.skip != 'true' && steps.trigger-slash.outputs.execution_url != ''
        env:
          PR_URL: ${{ steps.pr-meta.outputs.pr_url }}
          EXECUTION_URL: ${{ steps.trigger-slash.outputs.execution_url }}
        run: |
          echo "🤖 **Slash PR Healer** has been triggered for ${PR_URL}. [View execution logs](${EXECUTION_URL})" >> "$GITHUB_STEP_SUMMARY"
