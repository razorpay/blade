name: Agentic Repo / Slash Auto-Resolve PR Comments

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.event.pull_request.number }}-slash-resolve-comments
  cancel-in-progress: false

jobs:
  resolve-comments:
    name: Resolve PR review comments via Slash
    if: "github.actor != 'github-actions[bot]' && !contains(github.event.pull_request.labels.*.name, 'Agentic Comment Resolution: Skip')"
    runs-on: ubuntu-latest # nosemgrep: non-self-hosted-runner
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            .github/slash-resolve-comments-config.yml
            CODEOWNERS

      - name: Check if auto-resolution is enabled for PR author
        id: check-enabled
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          config=$(cat .github/slash-resolve-comments-config.yml 2>/dev/null || true)

          # Fail open: missing/unreadable config must not silently disable resolution.
          enabled=true
          if echo "$config" | grep -qE "^\s*default_enabled:\s*false\s*$"; then
            enabled=false
          fi
          if echo "$config" | grep -qE "^\s*${PR_AUTHOR}:\s*true\s*$"; then
            enabled=true
          elif echo "$config" | grep -qE "^\s*${PR_AUTHOR}:\s*false\s*$"; then
            enabled=false
          fi

          echo "Auto-resolve-comments enabled for $PR_AUTHOR: $enabled"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      # Public repo: anyone can submit a review, so only CODEOWNERS (plus the PR
      # author and bot_login, which the action always allows) may trigger Slash.
      - name: Collect CODEOWNERS
        id: codeowners
        if: steps.check-enabled.outputs.enabled == 'true'
        run: |
          owners=$(grep -oE '@[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)?' CODEOWNERS | grep -v '/' | sed 's/^@//' | sort -u | paste -sd, -)
          echo "allowed_usernames=$owners" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/slash-resolve-comments
        if: steps.check-enabled.outputs.enabled == 'true' && steps.codeowners.outputs.allowed_usernames != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          review_id: ${{ github.event.review.id }}
          branch: ${{ github.event.pull_request.head.ref }}
          pr_author: ${{ github.event.pull_request.user.login }}
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          allowed_usernames: ${{ steps.codeowners.outputs.allowed_usernames }}
          bot_login: "rzp-slash-public[bot],rzp-slash[bot],slash-code-review[bot],cursor[bot],kamaleshs-bridge4"
          slash_mentions: "@rzp-slash-public,@razorpay/slash-public"
          base_url: https://slash-api-ext.razorpay.com
          slash_username: ${{ secrets.SLASH_API_USERNAME }}
          slash_password: ${{ secrets.SLASH_API_PASSWORD }}
